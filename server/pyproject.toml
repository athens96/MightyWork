[project]
name = "mightywork-server"
version = "0.1.0"
description = "MightyWork API server: 일감(파이프라인) 관리 + 위키"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "google-auth>=2.30",
    "requests>=2.32",
    "pyjwt>=2.9",
    "markdown-it-py>=4.3.0",
    "mdit-py-plugins>=0.7.0",
    "pypandoc-binary>=1.17",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
