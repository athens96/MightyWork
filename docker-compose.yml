services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DB_BACKEND: ${DB_BACKEND:-sqlite}
      DATA_DIR: /app/data
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5174"]}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5174}
      APP_URL: ${APP_URL:-http://localhost:5174}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-[]}
    volumes:
      - mightywork_data:/app/data
    expose:
      - "8000"

  client:
    build:
      context: ./client
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${PORT:-5174}:80"

volumes:
  mightywork_data:
