# MightyWork 배포 설정 — scripts/deploy.sh (Mighty 앱 공통)가 읽는다.
# remote_* 함수는 VM 에서 $APP_DIR 안에서 실행된다.
APP=mighty-work
APP_DIR=/opt/mighty-work
REPO_URL=https://github.com/athens96/MightyWork.git
DOMAIN=mightywork.duckdns.org
SERVICE=mighty-work-api            # deploy/$SERVICE.service, 127.0.0.1:8000
HEALTH_PATH=/api/health
HEALTH_OK=200

# 처음 설치 때 server/.env 에 넣을 로컬 값 (Google 클라이언트 ID 는 비밀이 아니다)
GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID:-$([ -f server/.env ] && sed -n 's/^GOOGLE_CLIENT_ID=//p' server/.env || true)}"
APP_VARS=(GOOGLE_CLIENT_ID)

# Node.js 20+ (kordoc 한글 변환), pandoc (Word .docx 내보내기)
remote_prereqs() {
  if ! node -v 2>/dev/null | grep -qE '^v(2[0-9]|[3-9][0-9])\.'; then
    curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - >/dev/null
    sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs
  fi
  command -v pandoc >/dev/null 2>&1 || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc
}

remote_install() {
  mkdir -p server-rs
  if [ -f server-rs/mightywork-server.new ]; then
    chmod +x server-rs/mightywork-server.new
    mv -f server-rs/mightywork-server.new server-rs/mightywork-server
  elif [ ! -x server-rs/mightywork-server ]; then
    if command -v cargo >/dev/null 2>&1; then
      (cd server-rs && cargo build --release && cp target/release/mightywork-server ./mightywork-server)
    else
      echo "! server-rs/mightywork-server 바이너리가 없습니다. CI 또는 RUST_BIN_PATH 로 업로드하세요." >&2
      exit 1
    fi
  fi
  (cd server/tools/kordoc && npm ci --omit=dev --no-audit --no-fund --loglevel=error >/dev/null)
}

remote_env() {
  cat <<ENV
GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
DB_BACKEND=sqlite
DATA_DIR=data
CORS_ORIGINS=["https://$DOMAIN"]
PUBLIC_URL=https://$DOMAIN
APP_URL=https://$DOMAIN
ENV
}
