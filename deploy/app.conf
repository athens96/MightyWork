# MightyWork 배포 설정 — scripts/deploy.sh (Mighty 앱 공통)가 읽는다.
# remote_* 함수는 VM 에서 $APP_DIR 안에서 실행된다.
APP=mighty-work
APP_DIR=/opt/mighty-work
REPO_URL=https://github.com/athens96/MightyWork.git
DOMAIN=mightywork.duckdns.org
SERVICE=mighty-work-api            # deploy/$SERVICE.service, 127.0.0.1:8000
HEALTH_PATH=/api/health
HEALTH_OK=200

# 처음 설치 때 server/.env 에 넣을 로컬 값 (Google 클라이언트 ID 는 비밀이 아니다)
GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID:-$([ -f server/.env ] && sed -n 's/^GOOGLE_CLIENT_ID=//p' server/.env || true)}"
APP_VARS=(GOOGLE_CLIENT_ID)

# Node.js 20+ (kordoc 한글 변환), pandoc (Word .docx 내보내기)
remote_prereqs() {
  if ! node -v 2>/dev/null | grep -qE '^v(2[0-9]|[3-9][0-9])\.'; then
    curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - >/dev/null
    sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs
  fi
  command -v pandoc >/dev/null 2>&1 || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc
}

remote_install() {
  mkdir -p server-rs
  if [ -f server-rs/mightywork-server.new ]; then
    chmod +x server-rs/mightywork-server.new
    mv -f server-rs/mightywork-server.new server-rs/mightywork-server
  elif [ ! -x server-rs/mightywork-server ]; then
    if command -v cargo >/dev/null 2>&1; then
      (cd server-rs && cargo build --release && cp target/release/mightywork-server ./mightywork-server)
    else
      echo "! server-rs/mightywork-server 바이너리가 없습니다. CI 또는 RUST_BIN_PATH 로 업로드하세요." >&2
      exit 1
    fi
  fi
  (cd server/tools/kordoc && npm ci --omit=dev --no-audit --no-fund --loglevel=error >/dev/null)
  remote_ensure_nginx_http2_sse
}

# 기존 certbot 관리 nginx 사이트에 HTTP/2(ALPN h2)와 SSE 전용 프록시 블록을 안전하게 반영한다.
remote_ensure_nginx_http2_sse() {
  local site="/etc/nginx/sites-available/$APP"
  [ -f "$site" ] || return 0
  sudo python3 - "$site" <<'PY'
import pathlib, re, shutil, subprocess, sys

site = pathlib.Path(sys.argv[1])
orig = site.read_text(encoding="utf-8")
updated = orig

# 1) SSL 리스너에 http2 추가 (HTTP/1.1 6연결 한도 고갈 방지)
updated = re.sub(
    r"(listen\s+(?:\[::\]:)?443\s+ssl)(?![^;]*\bhttp2\b)([^;]*;)",
    r"\1 http2\2",
    updated,
)

# 2) SSE 전용 프록시 블록이 없으면 /api 프록시 블록 바로 앞에 삽입
sse_marker = "location ~ ^/api/(events|projects/[^/]+/events)$"
if sse_marker not in updated:
    sse_block = (
        "    # 실시간 SSE 스트림: HTTP/1.1 keep-alive + 버퍼링 끔\n"
        "    location ~ ^/api/(events|projects/[^/]+/events)$ {\n"
        "        proxy_pass http://127.0.0.1:8000;\n"
        "        proxy_set_header Host $host;\n"
        "        proxy_set_header X-Real-IP $remote_addr;\n"
        "        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n"
        "        proxy_set_header X-Forwarded-Proto $scheme;\n"
        "        proxy_http_version 1.1;\n"
        "        proxy_set_header Connection \"\";\n"
        "        proxy_buffering off;\n"
        "        proxy_cache off;\n"
        "        proxy_read_timeout 1h;\n"
        "    }\n\n"
    )
    target = "    location ~ ^/(api|oauth|\\.well-known)/ {"
    if target in updated:
        updated = updated.replace(target, sse_block + target, 1)

if updated == orig:
    sys.exit(0)

bak = pathlib.Path("/tmp/mighty-work-nginx.bak")
shutil.copy2(site, bak)
try:
    site.write_text(updated, encoding="utf-8")
    subprocess.run(["nginx", "-t", "-q"], check=True)
    subprocess.run(["systemctl", "reload", "nginx"], check=True)
    print("nginx updated: HTTP/2 + SSE proxy enabled")
except Exception as exc:
    shutil.copy2(bak, site)
    print(f"nginx update rolled back: {exc}", file=sys.stderr)
    sys.exit(1)
finally:
    bak.unlink(missing_ok=True)
PY
}

remote_env() {
  cat <<ENV
GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
DB_BACKEND=sqlite
DATA_DIR=data
CORS_ORIGINS=["https://$DOMAIN"]
PUBLIC_URL=https://$DOMAIN
APP_URL=https://$DOMAIN
ENV
}
