# /etc/nginx/sites-available/mighty-work
# 웹 앱(정적 빌드)과 API를 같은 origin 으로 서비스 → CORS 불필요, MCP·OAuth 주소도 한 도메인.
# 같은 VM 의 MightyTrade(mightytrade.duckdns.org)와는 server_name 으로 나뉜다.
server {
    listen 80;
    server_name mightywork.duckdns.org;   # = deploy/app.conf DOMAIN. `deploy.sh setup` 이 certbot 으로 HTTPS 추가

    root /opt/mighty-work/client/dist;
    index index.html;

    client_max_body_size 25m;   # 위키 가져오기·첨부

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # OAuth 동의 화면은 웹 앱 화면이다 (아래 /oauth/ 프록시보다 우선)
    location = /oauth/consent {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # REST API · OAuth 2.1 인가 서버 · 메타데이터 · MCP 서버 아이콘
    location ~ ^/(api|oauth|\.well-known)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # 한글·PDF 변환
    }
    location = /icon.png {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # MCP Streamable HTTP: SSE 스트리밍이므로 버퍼링 끔
    location = /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 해시가 붙은 빌드 자산은 바뀌지 않는다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx mime.types 에 없음
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # SPA fallback. index.html 은 매번 재검증해야 배포 후 지워진 자산을 가리키지 않는다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
